name: Bug Report
description: Report a bug or unexpected behavior in QuickSpot
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open QuickSpot with ⌘Space
        2. Type '...'
        3. Press Enter
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: QuickSpot version
      placeholder: e.g. 1.0.0 or commit hash
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version & chip
      placeholder: e.g. macOS 15.2 (Apple Silicon M3)
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Active app language
      options:
        - System Default
        - English (en)
        - Türkçe (tr)
        - Deutsch (de)
        - Español (es)
        - Français (fr)
        - 日本語 (ja)
        - 简体中文 (zh-Hans)
        - Português (Brasil) (pt-BR)
