name: Stale Issues & PRs

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark & Clean Inactive Threads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          exempt-issue-labels: 'pinned,security,privacy,localization'
          exempt-pr-labels: 'pinned,security,localization'
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          stale-issue-message: 'This issue has been inactive for 60 days and will be closed in 14 days unless updated.'
          stale-pr-message: 'This pull request has been inactive for 30 days and will be closed in 14 days unless updated.'
          close-issue-message: 'Closing due to inactivity. Feel free to reopen with new details.'
          close-pr-message: 'Closing due to inactivity. Feel free to reopen when ready.'
