name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without leading v (e.g. 1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark GitHub Release as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish macOS (Apple Silicon) Release
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine release version & tag
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION#v}"
            TAG="v${VERSION}"
            PRERELEASE="${INPUT_PRERELEASE:-false}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            if [[ "$VERSION" == *-* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Run privacy gate & unit tests
        run: |
          ./scripts/check-privacy.sh
          swift test

      - name: Import Apple Developer ID certificate (optional)
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: |
          if [[ -z "${APPLE_CERT_P12_BASE64}" || -z "${APPLE_SIGN_IDENTITY}" ]]; then
            echo "Skipping Developer ID certificate import (signing secrets not configured; using ad-hoc signing)."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/quickspot-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/dev-id.p12"

          printf '%s' "$APPLE_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Build and package DMG + ZIP + SHA256
        env:
          CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY || '-' }}
        run: |
          ./scripts/package-release.sh \
            --version "${{ steps.meta.outputs.version }}" \
            --build-number "${GITHUB_RUN_NUMBER}"

      - name: Notarize and staple DMG (optional)
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if [[ -z "${APPLE_NOTARY_KEY_BASE64}" || -z "${APPLE_NOTARY_KEY_ID}" || -z "${APPLE_NOTARY_ISSUER_ID}" ]]; then
            echo "Skipping notarization (notary secrets not configured)."
            exit 0
          fi

          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          DMG_FILE="$(ls build.noindex/dist/*.dmg | head -n 1)"
          xcrun notarytool submit "$DMG_FILE" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG_FILE"
          rm -f "$KEY_PATH"
          (
            cd build.noindex/dist
            shasum -a 256 *.zip *.dmg > SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          PRERELEASE_FLAG=()
          if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build.noindex/dist/* --clobber
          else
            gh release create "$TAG" build.noindex/dist/* \
              --title "QuickSpot $TAG" \
              --generate-notes \
              "${PRERELEASE_FLAG[@]}"
          fi

      - name: Update Homebrew Tap Cask (optional)
        if: steps.meta.outputs.prerelease != 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          if [[ -z "${HOMEBREW_TAP_TOKEN}" || -z "${HOMEBREW_TAP_REPO}" ]]; then
            echo "Skipping Homebrew Tap update (HOMEBREW_TAP_TOKEN / HOMEBREW_TAP_REPO not configured)."
            exit 0
          fi
          DMG_PATH="$(ls build.noindex/dist/*.dmg | head -n 1)"
          DMG_FILE="$(basename "$DMG_PATH")"
          DMG_SHA256="$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')"

          AUTH_HEADER="$(printf 'x-access-token:%s' "$HOMEBREW_TAP_TOKEN" | base64 | tr -d '\n')"
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          rm -rf "$TAP_DIR"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            clone --depth 1 "https://github.com/${HOMEBREW_TAP_REPO}.git" "$TAP_DIR"

          ./scripts/render-homebrew-cask.sh \
            --version "$RELEASE_VERSION" \
            --sha256 "$DMG_SHA256" \
            --repo "$SOURCE_REPO" \
            --dmg-name "$DMG_FILE" \
            --output "$TAP_DIR/Casks/quickspot.rb"

          cd "$TAP_DIR"
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "Homebrew cask already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/quickspot.rb
          git commit -m "chore(quickspot): bump to v${RELEASE_VERSION}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" push origin HEAD
