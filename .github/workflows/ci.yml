name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy-and-hygiene:
    name: Privacy & Secret Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run privacy & secret checks
        run: ./scripts/check-privacy.sh

  build-and-test:
    name: Build, Test & App Bundle (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run privacy, plist & .strings lint
        run: ./scripts/check-privacy.sh

      - name: Run unit tests (including 8-language parity)
        run: swift test

      - name: Build and verify signed QuickSpot.app bundle
        run: ./build.sh
